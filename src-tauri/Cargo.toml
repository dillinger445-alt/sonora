[package]
name = "sonora-desktop"
version = "0.4.0"
description = "SONORA desktop application (Tauri 2 shell around sonora-core)"
authors = ["SONORA"]
edition = "2021"
# Tauri 2.12 requires Rust 1.90 or newer.
rust-version = "1.90"
publish = false

# The desktop shell is its own Cargo workspace: it pulls Tauri from crates.io,
# while the root workspace (engine, core, CLI, dev bridge) builds offline.
[workspace]

[lib]
name = "sonora_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "sonora-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
# Pinned to the same minor versions as @tauri-apps/api and the
# @tauri-apps/plugin-* packages in package.json (`~`): `tauri build` refuses
# a major/minor mismatch between them. Upgrade both sides together.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-opener = "~2.7"
tauri-plugin-single-instance = "~2.5"
# In-app updates from GitHub releases (signature-checked) and the restart after them.
tauri-plugin-updater = "~2.14"
tauri-plugin-process = "~2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compiled from source and statically linked on every platform. The
# core only declares the C API (its `external-sqlite` feature drops its own
# `#[link(name = "sqlite3")]`), and this crate supplies the symbols.
# Keep the default features: the crate's build script always references its
# pkg-config and vcpkg build dependencies, even when `bundled` is used.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
sonora-core = { path = "../crates/sonora-core", features = ["external-sqlite"] }
sonora-json = { path = "../crates/sonora-json" }

[profile.dev]
opt-level = 1

# DSP code is very slow unoptimised; keep `tauri dev` analysis usable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
