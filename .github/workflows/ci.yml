name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg and the SQLite library (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsqlite3-dev

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install ffmpeg

      # Windows runs without FFmpeg on purpose: the native WAV/AIFF/FLAC path
      # must work on its own, and tests that need FFmpeg skip themselves.
      # The core links the SQLite that ships with Windows (winsqlite3).
      - name: Test
        run: |
          # On failure, failing tests and compiler errors are also posted as
          # annotations, so they can be read without the raw log.
          set +e
          cargo test --workspace --locked 2>&1 | tee test-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk test-output.txt; fi
          exit "$status"

      # Move to Recycle Bin must never delete a file for good: with the
      # Recycle Bin turned off for the drive, the file has to stay. The test
      # changes the runner's Recycle Bin setting for a moment, so it only
      # runs here.
      - name: Recycle Bin safety (Windows)
        if: runner.os == 'Windows'
        run: |
          set +e
          cargo test -p sonora-core --lib --locked -- --ignored --exact trash::tests::windows_never_deletes_what_it_cannot_recycle 2>&1 | tee recycle-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk recycle-output.txt; fi
          exit "$status"

      # slskd's API key lives in the system's secret store. These run against
      # the real store: on macOS a keychain made for the run (the runner's
      # login keychain may be locked), on Windows the runner's Credential
      # Manager.
      - name: Secret store (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          kc="$RUNNER_TEMP/sonora-ci.keychain-db"
          security create-keychain -p sonora-ci "$kc"
          security unlock-keychain -p sonora-ci "$kc"
          old_default=$(security default-keychain -d user | xargs)
          read -ra old_list <<< "$(security list-keychains -d user | xargs)"
          security list-keychains -d user -s "$kc" "${old_list[@]}"
          security default-keychain -d user -s "$kc"
          cargo test -p sonora-core --lib --locked -- --ignored --exact secrets::tests::system_store_round_trip --nocapture 2>&1 | tee secrets-output.txt
          status=${PIPESTATUS[0]}
          security default-keychain -d user -s "$old_default"
          security list-keychains -d user -s "${old_list[@]}"
          security delete-keychain "$kc"
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk secrets-output.txt; fi
          grep -q "store: keychain" secrets-output.txt || { [ "$status" -ne 0 ] || { echo "::error::the keychain was not used"; status=1; }; }
          exit "$status"

      # SONORA runs slskd with a launch agent on macOS. This loads one for
      # the runner's user (with a stand-in program), checks that launchd
      # runs it, restarts it after a crash and stops it, and removes it.
      - name: Launch agent (macOS)
        if: runner.os == 'macOS'
        run: |
          set +e
          SONORA_LAUNCHD_TEST=1 cargo test -p sonora-core --lib --locked -- --ignored --exact slskd_service::tests::launchd_takes_the_launch_agent --nocapture 2>&1 | tee launchd-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk launchd-output.txt; fi
          grep -q "launchd ran it in both modes" launchd-output.txt || { [ "$status" -ne 0 ] || { echo "::error::the launch agent test did not run"; status=1; }; }
          exit "$status"

      - name: Secret store (Windows)
        if: runner.os == 'Windows'
        run: |
          set +e
          cargo test -p sonora-core --lib --locked -- --ignored --exact secrets::tests::system_store_round_trip --nocapture 2>&1 | tee secrets-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk secrets-output.txt; fi
          grep -q "store: credential-manager" secrets-output.txt || { [ "$status" -ne 0 ] || { echo "::error::Credential Manager was not used"; status=1; }; }
          exit "$status"

      - name: Lint
        if: runner.os == 'Linux'
        run: |
          rustup component add clippy
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk clippy-output.txt; fi
          exit "$status"

  frontend:
    name: Frontend (types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No package-lock.json is committed yet, so dependencies are resolved
      # fresh on every run. Once the lockfile is committed, switch to
      # `npm ci` and add `cache: npm` to setup-node (it keys on the lockfile).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end tests (Chromium + dev bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg and the SQLite library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsqlite3-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # See the frontend job: switch to `npm ci` once the lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Build the interface
        run: npm run build

      # e2e/serve.mjs builds the dev bridge, generates the audio corpus in
      # e2e/.data and starts every run from an empty library.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: Desktop bundle (${{ matrix.name }})
    # Bundling is slow and macOS minutes are expensive: only bundle code
    # that passed the tests.
    needs: [rust, frontend]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    env:
      # Signing runs only when the corresponding secrets exist.
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # See the frontend job: switch to `npm ci` once the lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch FFmpeg for the bundle
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - name: Import the Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          Remove-Item $pfx
          if (-not $cert) { throw 'The certificate in WINDOWS_CERTIFICATE has no private key.' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and bundle
        env:
          BUILD_TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Tauri treats a variable that is set but empty as a request to
          # sign or notarize, so drop the ones whose secrets are not set.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID \
                      APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          args=(--target "$BUILD_TARGET" --config src-tauri/tauri.bundle-ffmpeg.json)
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -z "${APPLE_CERTIFICATE:-}" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
              # No Developer ID certificate: sign ad hoc so the bundle at least
              # carries a consistent signature (Gatekeeper still warns). Apple
              # rejects ad-hoc builds for notarization, so skip that too.
              args+=(--config '{"bundle":{"macOS":{"signingIdentity":"-"}}}')
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY
            elif [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY:-key}.p8"
              printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
            fi
          fi
          unset APPLE_API_PRIVATE_KEY
          if [ -n "${WINDOWS_CERTIFICATE_THUMBPRINT:-}" ]; then
            args+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_CERTIFICATE_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          # On failure, the errors are also posted as annotations (see the Test step).
          set +e
          npx tauri build "${args[@]}" 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk build-output.txt; fi
          exit "$status"

      - name: Collect the bundles
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$BUILD_TARGET/release/bundle"
          mkdir -p bundles-out
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$bundle"/dmg/*.dmg bundles-out/
            # Archive the .app so its symlinks and permissions survive the upload.
            tar -C "$bundle/macos" -czf "bundles-out/SONORA_$BUILD_TARGET.app.tar.gz" SONORA.app
          else
            cp "$bundle"/msi/*.msi "$bundle"/nsis/*.exe bundles-out/
          fi
          ls -l bundles-out

      - uses: actions/upload-artifact@v7
        with:
          name: SONORA-${{ matrix.target }}
          path: bundles-out/
          if-no-files-found: error
          retention-days: 14
