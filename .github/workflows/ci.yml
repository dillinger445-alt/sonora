name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: End-to-end tests (Chromium + dev bridge)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Install FFmpeg and the SQLite library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libsqlite3-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # See the frontend job: switch to `npm ci` once the lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Build the interface
        run: npm run build

      # e2e/serve.mjs builds the dev bridge, generates the audio corpus in
      # e2e/.data and starts every run from an empty library.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

