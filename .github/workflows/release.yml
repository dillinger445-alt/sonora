name: Release

# Pushing a tag v<version> publishes that version: installers for macOS
# (Apple silicon and Intel) and Windows, each signed for the in-app updater,
# and latest.json, which running copies of SONORA read to find the update.
# See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  # Releases a tag that exists already with this version of the workflow:
  # after a failed run, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release (v<version>); it must exist
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Check the version and open a draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # Spaces and line breaks pasted with the key are ignored (as in the build).
          key="$(printf '%s' "${TAURI_SIGNING_PRIVATE_KEY:-}" | tr -d '[:space:]')"
          if [ -z "$key" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is missing. Updates must be signed; see docs/RELEASING.md."
            exit 1
          fi
          decoded="$(printf '%s' "$key" | base64 -d 2>/dev/null || true)"
          case "$decoded" in
            "untrusted comment:"*) ;;
            *)
              echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is not a Tauri private key: its value must be the whole content of the .key file. See docs/RELEASING.md."
              exit 1
              ;;
          esac

      - name: Check that the tag matches the version
        run: node scripts/release.ts check "$TAG"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release.ts notes "${TAG#v}" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Made earlier, or on the GitHub website (which creates the tag
            # by publishing a release): it gets the changelog as its notes
            # and title when it has none, and stays a draft until its files
            # are in place. Its files are replaced.
            if [ -z "$(gh release view "$TAG" --json body --jq '.body // ""')" ]; then
              gh release edit "$TAG" --notes-file notes.md
            fi
            if [ -z "$(gh release view "$TAG" --json name --jq '.name // ""')" ]; then
              gh release edit "$TAG" --title "SONORA ${TAG#v}"
            fi
            gh release edit "$TAG" --draft=true
            echo "A release for $TAG exists already: a draft until its files are in place."
          else
            gh release create "$TAG" --draft --verify-tag --title "SONORA ${TAG#v}" --notes-file notes.md
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
    env:
      HAS_WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No package-lock.json is committed yet (see ci.yml).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch FFmpeg for the bundle
        run: node scripts/fetch-ffmpeg.mjs --target ${{ matrix.target }}

      - name: Import the Windows code-signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password |
            Where-Object { $_.HasPrivateKey } | Select-Object -First 1
          Remove-Item $pfx
          if (-not $cert) { throw 'The certificate in WINDOWS_CERTIFICATE has no private key.' }
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, bundle and sign the updates
        env:
          BUILD_TARGET: ${{ matrix.target }}
          # Signs the update packages; the matching public key is in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # A key pasted with a line break at its end is still the key:
          # base64 holds no spaces or line breaks.
          TAURI_SIGNING_PRIVATE_KEY="$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '[:space:]')"
          export TAURI_SIGNING_PRIVATE_KEY
          # Tauri treats a variable that is set but empty as a request to
          # sign or notarize, so drop the ones whose secrets are not set. An
          # empty key password is the same as none.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID \
                      APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then unset "$name"; fi
          done
          args=(--target "$BUILD_TARGET" --config src-tauri/tauri.bundle-ffmpeg.json --config src-tauri/tauri.release.json)
          if [ "$RUNNER_OS" = macOS ]; then
            if [ -z "${APPLE_CERTIFICATE:-}" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
              args+=(--config '{"bundle":{"macOS":{"signingIdentity":"-"}}}')
              unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_PRIVATE_KEY
            elif [ -n "${APPLE_API_PRIVATE_KEY:-}" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY:-key}.p8"
              printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
            fi
          fi
          unset APPLE_API_PRIVATE_KEY
          if [ -n "${WINDOWS_CERTIFICATE_THUMBPRINT:-}" ]; then
            args+=(--config "{\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$WINDOWS_CERTIFICATE_THUMBPRINT\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}")
          fi
          set +e
          npx tauri build "${args[@]}" 2>&1 | tee build-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then awk -f .github/scripts/cargo-annotations.awk build-output.txt; fi
          exit "$status"

      - name: Add the files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bundle="src-tauri/target/$BUILD_TARGET/release/bundle"
          mkdir -p out
          if [ "$RUNNER_OS" = macOS ]; then
            cp "$bundle"/dmg/*.dmg out/
            # Both architectures produce SONORA.app.tar.gz: name them apart.
            cp "$bundle/macos/SONORA.app.tar.gz" "out/SONORA_${version}_${ARCH}.app.tar.gz"
            cp "$bundle/macos/SONORA.app.tar.gz.sig" "out/SONORA_${version}_${ARCH}.app.tar.gz.sig"
          else
            cp "$bundle"/nsis/*-setup.exe "$bundle"/nsis/*-setup.exe.sig "$bundle"/msi/*.msi "$bundle"/msi/*.msi.sig out/
          fi
          ls -l out
          gh release upload "$TAG" out/* --clobber

  publish:
    name: Publish the release and the update manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Write latest.json and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir signatures
          gh release download "$TAG" --dir signatures --pattern '*.sig'
          gh release view "$TAG" --json assets --jq '.assets[].name' > uploaded.txt
          node scripts/release.ts notes "${TAG#v}" > notes.md
          node scripts/release.ts manifest signatures "$TAG" "$GITHUB_REPOSITORY" notes.md uploaded.txt > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
          # Published last: running copies only see the update once every
          # file it names is in place.
          gh release edit "$TAG" --draft=false --latest
